name: Validate control plane

on:
  pull_request:
    paths:
      - 'automation/control-plane/**'
      - 'scripts/validate-control-plane-contracts.mjs'
      - 'scripts/validate-control-plane-hardening.mjs'
      - 'scripts/validate-orchestration-contract.mjs'
      - 'scripts/validate-ttd-trust-anchor.mjs'
      - 'scripts/lib/ttd-*.mjs'
      - 'scripts/test-ttd-*.mjs'
      - 'scripts/lib/control-plane-result.mjs'
      - 'scripts/write-control-plane-result.mjs'
      - 'scripts/validate-control-plane-result.mjs'
      - 'scripts/test-control-plane-result.mjs'
      - '.github/workflows/validate-control-plane.yml'
  push:
    branches: [main]
    paths:
      - 'automation/control-plane/**'
      - 'scripts/validate-control-plane-contracts.mjs'
      - 'scripts/validate-control-plane-hardening.mjs'
      - 'scripts/validate-orchestration-contract.mjs'
      - 'scripts/validate-ttd-trust-anchor.mjs'
      - 'scripts/lib/ttd-*.mjs'
      - 'scripts/test-ttd-*.mjs'
      - 'scripts/lib/control-plane-result.mjs'
      - 'scripts/write-control-plane-result.mjs'
      - 'scripts/validate-control-plane-result.mjs'
      - 'scripts/test-control-plane-result.mjs'
      - '.github/workflows/validate-control-plane.yml'

permissions:
  contents: read

jobs:
  validate-control-plane:
    runs-on: ubuntu-latest
    steps:
      - name: Check out commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate control-plane contracts
        run: node scripts/validate-control-plane-contracts.mjs

      - name: Validate control-plane hardening invariants
        run: node scripts/validate-control-plane-hardening.mjs

      - name: Validate orchestration contract
        run: node scripts/validate-orchestration-contract.mjs

      - name: Validate Things-to-Do policy trust anchor
        run: node scripts/validate-ttd-trust-anchor.mjs

      - name: Things-to-Do normalization acceptance (source evidence to facts)
        run: node scripts/test-ttd-normalization.mjs

      - name: Things-to-Do policy evaluation acceptance (facts to disposition)
        run: node scripts/test-ttd-policy-evaluator.mjs

      - name: Things-to-Do routing and audit composition
        run: node scripts/test-ttd-adjudication-composition.mjs

      - name: Things-to-Do adversarial regressions
        run: node scripts/test-ttd-adversarial-regressions.mjs

      - name: Control-plane task-result acceptance and fail-closed regressions
        run: node scripts/test-control-plane-result.mjs

      # Real results live on a separate ref (refs/heads/control-plane-task-
      # results), which a standard single-branch checkout does not fetch, so
      # this normally reports NO_RESULTS_FOUND here. It still exercises the
      # ref-absent code path and stands ready as soon as that ref is fetched.
      - name: Validate every persisted control-plane task result
        run: node scripts/validate-control-plane-result.mjs

      - name: Validate committed control-plane task-result example fixtures
        run: node scripts/validate-control-plane-result.mjs --result=automation/control-plane/fixtures/task-result-examples/needs-evidence-verification.json
      - run: node scripts/validate-control-plane-result.mjs --result=automation/control-plane/fixtures/task-result-examples/needs-project-03-decision.json
      - run: node scripts/validate-control-plane-result.mjs --result=automation/control-plane/fixtures/task-result-examples/technical-validation-failed.json
      - run: node scripts/validate-control-plane-result.mjs --result=automation/control-plane/fixtures/task-result-examples/review-passed.json
      - run: node scripts/validate-control-plane-result.mjs --result=automation/control-plane/fixtures/task-result-examples/review-failed.json
