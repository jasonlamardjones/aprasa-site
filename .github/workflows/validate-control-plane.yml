name: Validate control plane

on:
  pull_request:
    paths:
      - 'automation/control-plane/**'
      - 'scripts/validate-control-plane-contracts.mjs'
      - 'scripts/validate-control-plane-hardening.mjs'
      - 'scripts/validate-orchestration-contract.mjs'
      - 'scripts/validate-ttd-trust-anchor.mjs'
      - 'scripts/lib/ttd-*.mjs'
      - 'scripts/test-ttd-*.mjs'
      - '.github/workflows/validate-control-plane.yml'
  push:
    branches: [main]
    paths:
      - 'automation/control-plane/**'
      - 'scripts/validate-control-plane-contracts.mjs'
      - 'scripts/validate-control-plane-hardening.mjs'
      - 'scripts/validate-orchestration-contract.mjs'
      - 'scripts/validate-ttd-trust-anchor.mjs'
      - 'scripts/lib/ttd-*.mjs'
      - 'scripts/test-ttd-*.mjs'
      - '.github/workflows/validate-control-plane.yml'

permissions:
  contents: read

jobs:
  validate-control-plane:
    runs-on: ubuntu-latest
    steps:
      - name: Check out commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate control-plane contracts
        run: node scripts/validate-control-plane-contracts.mjs

      - name: Validate control-plane hardening invariants
        run: node scripts/validate-control-plane-hardening.mjs

      - name: Validate orchestration contract
        run: node scripts/validate-orchestration-contract.mjs

      - name: Validate Things-to-Do policy trust anchor
        run: node scripts/validate-ttd-trust-anchor.mjs

      - name: Things-to-Do normalization acceptance (source evidence to facts)
        run: node scripts/test-ttd-normalization.mjs

      - name: Things-to-Do policy evaluation acceptance (facts to disposition)
        run: node scripts/test-ttd-policy-evaluator.mjs

      - name: Things-to-Do routing and audit composition
        run: node scripts/test-ttd-adjudication-composition.mjs

      - name: Things-to-Do adversarial regressions
        run: node scripts/test-ttd-adversarial-regressions.mjs
