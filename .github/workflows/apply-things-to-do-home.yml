name: Apply generated Things to Do Home

on:
  push:
    branches:
      - claude/structured-event-currentness-v1
    paths:
      - '.github/workflows/apply-things-to-do-home.yml'
      - 'scripts/generate-things-to-do.mjs'
      - 'data/things-to-do-events.json'

permissions:
  contents: write

jobs:
  apply-home:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: claude/structured-event-currentness-v1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate validated surfaces
        run: |
          node scripts/generate-things-to-do.mjs --as-of=2026-08-22 --write
          node scripts/validate-things-to-do-currentness.mjs --as-of=2026-08-22
          node scripts/validate-things-to-do-surface-equivalence.mjs --as-of=2026-08-22
          node scripts/validate-things-to-do-sitemap.mjs
          git diff --check

      - name: Verify Home-only commit scope
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'index.html already matches generated output.'
            exit 0
          fi
          changed=$(git diff --name-only -- index.html)
          test "$changed" = 'index.html'
          echo 'Only index.html will be committed.'

      - name: Commit generated Home
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Generate Things to Do Home from canonical events'
          git push origin HEAD:claude/structured-event-currentness-v1
