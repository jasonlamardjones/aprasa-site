name: Phase 2B — Things-to-Do currentness remediation

on:
  workflow_run:
    workflows:
      - Post-publication QA
    types:
      - completed

# This is the first and only Phase 2B write-authorized workflow. Phase 2A stays
# read-only. These permissions are limited to reading its artifact, pushing one
# bounded repair branch, creating one draft PR, and raising/updating one
# deduplicated failure-visibility issue. There is no merge, Pages, deployment,
# package, or environment write authority.
#
# `issues: write` exists solely for the failure signal below. A Phase 2B run
# that refuses to produce a repair was otherwise operationally silent — a red
# Actions run and nothing else — so the refusal is now recorded as one durable
# GitHub issue per failure class. It carries issue text only: no branch, no
# commit, no pull request, no published content.
permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: phase2b-things-to-do-currentness
  cancel-in-progress: false

jobs:
  remediate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact QA source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download the producing Phase 2A artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: post-publication-qa-*-${{ github.event.workflow_run.id }}-*
          # Outside GITHUB_WORKSPACE on purpose: the adapter refuses to run in a
          # dirty worktree, and an artifact unpacked into the checkout is itself
          # an untracked change. Keep this in step with --report below.
          path: ${{ runner.temp }}/qa-input
          merge-multiple: true

      # STEP timeout, deliberately lower than the JOB timeout above.
      #
      # A job-level timeout cancels the JOB, and a cancelled job does not go on
      # to evaluate later steps — so an adapter that hung until the 15-minute
      # ceiling would take the durable failure reporter down with it, leaving
      # hang-to-timeout as the one silent failure mode in a tranche whose whole
      # purpose is that Phase 2B stops failing silently.
      #
      # Capping the adapter at 10 minutes makes that timeout a STEP failure
      # instead: the step fails, the job is still alive with roughly five
      # minutes of reserved budget, and `if: failure()` below therefore runs and
      # records the signal. The job's 15 minutes stays as the outer ceiling for
      # anything this cap does not catch.
      #
      # Keep this strictly below the job timeout. The Phase 2B unit suite
      # asserts that relationship on this file, so narrowing the gap to zero
      # fails the tests rather than silently removing the reporter's headroom.
      - name: Run bounded Phase 2B remediation adapter
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        # The adapter's output is teed outside GITHUB_WORKSPACE — the same reason
        # the artifact is unpacked there — so the failure step below can classify
        # the refusal without making the checkout dirty. pipefail keeps the
        # adapter's own exit status authoritative through the pipe.
        run: |
          set -o pipefail
          node scripts/remediation/run-things-to-do-currentness-remediation.mjs \
            --report='${{ runner.temp }}/qa-input/post-publication-qa.json' \
            --repository='${{ github.repository }}' \
            --workflow-run-id='${{ github.event.workflow_run.id }}' \
            --workflow-run-attempt='${{ github.event.workflow_run.run_attempt }}' \
            --workflow-head-sha='${{ github.event.workflow_run.head_sha }}' \
            2>&1 | tee '${{ runner.temp }}/phase2b-adapter.log'

      # Failure visibility. Runs ONLY on failure, so a green run — and an
      # authorized-but-skipped or duplicate-suppressed run, both of which exit 0
      # — creates nothing at all. One open issue per failure class, one further
      # comment per distinct failing commit, so repeated identical failures
      # cannot spam the tracker. See scripts/remediation/lib/phase2b-failure-signal.mjs.
      - name: Record durable Phase 2B failure signal
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          node scripts/remediation/report-phase2b-failure.mjs \
            --repository='${{ github.repository }}' \
            --run-id='${{ github.run_id }}' \
            --run-attempt='${{ github.run_attempt }}' \
            --commit='${{ github.event.workflow_run.head_sha }}' \
            --log='${{ runner.temp }}/phase2b-adapter.log'
