name: Phase 2B — Things-to-Do currentness remediation

on:
  workflow_run:
    workflows:
      - Post-publication QA
    types:
      - completed

# This is the first and only Phase 2B write-authorized workflow. Phase 2A stays
# read-only. These permissions are limited to reading its artifact, pushing one
# bounded repair branch, creating one draft PR, and raising/updating one
# deduplicated failure-visibility issue. There is no merge, Pages, deployment,
# package, or environment write authority.
#
# `issues: write` exists solely for the failure signal below. A Phase 2B run
# that refuses to produce a repair was otherwise operationally silent — a red
# Actions run and nothing else — so the refusal is now recorded as one durable
# GitHub issue per failure class. It carries issue text only: no branch, no
# commit, no pull request, no published content.
permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: phase2b-things-to-do-currentness
  cancel-in-progress: false

jobs:
  remediate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact QA source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download the producing Phase 2A artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: post-publication-qa-*-${{ github.event.workflow_run.id }}-*
          # Outside GITHUB_WORKSPACE on purpose: the adapter refuses to run in a
          # dirty worktree, and an artifact unpacked into the checkout is itself
          # an untracked change. Keep this in step with --report below.
          path: ${{ runner.temp }}/qa-input
          merge-multiple: true

      # STEP timeout. It bounds how long the adapter itself may run; it is NOT
      # relied upon as headroom for the durable failure reporter.
      #
      # An earlier revision tried to reserve reporter budget arithmetically by
      # keeping this cap below the job's. That does not hold: the job clock
      # starts at JOB start, so checkout, setup-node and the artifact download
      # all spend it before this step begins. Slow setup plus a hanging adapter
      # can still reach the 15-minute job ceiling while this step is inside its
      # own 10 minutes, cancelling the job with no later step evaluated.
      #
      # Reporting is therefore no longer a step in this job at all — it is the
      # separate `report_failure` job below, with its own lifecycle and its own
      # budget. See the comment on that job.
      - name: Run bounded Phase 2B remediation adapter
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        # The adapter's output is teed outside GITHUB_WORKSPACE — the same reason
        # the artifact is unpacked there — so the reporter job below can classify
        # the refusal without making the checkout dirty. pipefail keeps the
        # adapter's own exit status authoritative through the pipe.
        run: |
          set -o pipefail
          node scripts/remediation/run-things-to-do-currentness-remediation.mjs \
            --report='${{ runner.temp }}/qa-input/post-publication-qa.json' \
            --repository='${{ github.repository }}' \
            --workflow-run-id='${{ github.event.workflow_run.id }}' \
            --workflow-run-attempt='${{ github.event.workflow_run.run_attempt }}' \
            --workflow-head-sha='${{ github.event.workflow_run.head_sha }}' \
            2>&1 | tee '${{ runner.temp }}/phase2b-adapter.log'

      # Best-effort evidence preservation, so the reporter job can classify a
      # real failure from the real log rather than from its absence.
      #
      # Deliberately incapable of blocking anything: `continue-on-error` and
      # `if-no-files-found: ignore` mean a missing log or a failed upload cannot
      # turn preservation into a new failure mode. A job-level timeout can kill
      # this job before this step runs at all — that is expected, and the
      # reporter job still runs and records the conservative UNKNOWN state.
      #
      # This artifact is evidence only. It carries no authority.
      - name: Preserve the adapter log for the reporter job
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase2b-adapter-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phase2b-adapter.log
          if-no-files-found: ignore
          retention-days: 7

  # Failure visibility, as a SEPARATE JOB with its own lifecycle and budget.
  #
  # This is the structural form of the reservation. `remediate` may fail
  # normally, have its adapter step time out, or reach its own 15-minute
  # ceiling and be cancelled outright — in every one of those cases this job
  # still starts, because its budget is not drawn from `remediate`'s clock.
  # That closes hang-to-timeout, which an in-job step could not: a cancelled
  # job does not go on to evaluate its later steps.
  #
  # It runs ONLY when remediation ended in failure or cancellation. A green run
  # — including an authorized-but-skipped or duplicate-suppressed run, both of
  # which exit 0 — creates nothing at all, and a run skipped as unauthorized or
  # non-main leaves `remediate` with result `skipped`, which this gate excludes.
  #
  # One open issue per failure class, one further comment per distinct failing
  # commit, so repeated identical failures cannot spam the tracker. See
  # scripts/remediation/lib/phase2b-failure-signal.mjs.
  report_failure:
    needs: remediate
    if: >-
      always() &&
      (needs.remediate.result == 'failure' ||
       needs.remediate.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact QA source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Tolerant on purpose. When `remediate` was cancelled by its job timeout
      # the upload step never ran, so there is no artifact to fetch — and that
      # is precisely the case this job exists to report. `continue-on-error`
      # keeps the absence from aborting the job before the reporter runs.
      - name: Download the preserved adapter log
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase2b-adapter-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phase2b-log

      # `--log` points at the expected path whether or not the download landed.
      # The reporter's incumbent missing-log handling classifies an absent or
      # unreadable log as a reportable UNKNOWN state; no synthetic log is
      # fabricated and no specific failure class is claimed on its behalf.
      - name: Record durable Phase 2B failure signal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          node scripts/remediation/report-phase2b-failure.mjs \
            --repository='${{ github.repository }}' \
            --run-id='${{ github.run_id }}' \
            --run-attempt='${{ github.run_attempt }}' \
            --commit='${{ github.event.workflow_run.head_sha }}' \
            --log='${{ runner.temp }}/phase2b-log/phase2b-adapter.log'
