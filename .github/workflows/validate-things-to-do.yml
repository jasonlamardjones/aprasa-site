name: Validate Things to Do currentness

on:
  pull_request:
    paths:
      - 'automation/things-to-do/**'
      - 'data/locales/**'
      - 'data/things-to-do-events.json'
      - 'data/things-to-do-currentness.json'
      - 'internal/provider-media-manifest.json'
      - 'scripts/build-sitemap.mjs'
      - 'scripts/build-locale-data.mjs'
      - 'scripts/generate-things-to-do.mjs'
      - 'scripts/render-things-to-do-adapter.mjs'
      - 'scripts/prepare-event-publication.mjs'
      - 'scripts/write-event-publication.mjs'
      - 'scripts/test-event-publication-write.mjs'
      - 'scripts/validate-event-publication-packet.mjs'
      - 'scripts/lib/event-publication-contract.mjs'
      - 'scripts/lib/event-publication-write.mjs'
      - 'scripts/validate-locale-contract.mjs'
      - 'scripts/validate-things-to-do-*.mjs'
      - 'scripts/validate-card-media.mjs'
      - 'scripts/validate-training-opportunities-currentness.mjs'
      - 'index.html'
      - 'pt/index.html'
      - 'sitemap.xml'
      - 'things-to-do/**'
      - 'pt/things-to-do/**'
      - '.github/workflows/validate-things-to-do.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate Phase 1 publication packet fixtures
        shell: bash
        run: |
          set -e

          node scripts/validate-event-publication-packet.mjs \
            --packet=automation/things-to-do/fixtures/ready.json
          node scripts/prepare-event-publication.mjs \
            --packet=automation/things-to-do/fixtures/ready.json \
            | grep -q 'STATUS: REVIEW_READY'

          expect_block() {
            fixture="$1"
            expected="$2"
            set +e
            output=$(node scripts/validate-event-publication-packet.mjs --packet="$fixture" 2>&1)
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              echo "$fixture unexpectedly passed preflight"
              exit 1
            fi
            echo "$output" | grep -q "\"state\": \"$expected\"" || {
              echo "$fixture did not resolve to expected state $expected"
              echo "$output"
              exit 1
            }
          }

          expect_block automation/things-to-do/fixtures/blocked-localization.json BLOCKED_LOCALIZATION
          expect_block automation/things-to-do/fixtures/blocked-media.json BLOCKED_MEDIA
          expect_block automation/things-to-do/fixtures/invalid-input.json INVALID_INPUT

      - name: Validate Phase 1B guarded real-write workflow
        run: node scripts/test-event-publication-write.mjs

      - name: Load explicit currentness date
        shell: bash
        run: |
          AS_OF=$(node -e "const fs=require('fs'); const value=JSON.parse(fs.readFileSync('data/things-to-do-currentness.json','utf8')).as_of; if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(value)) process.exit(1); process.stdout.write(value)")
          echo "AS_OF=$AS_OF" >> "$GITHUB_ENV"
          echo "Validating committed Things to Do surfaces as of $AS_OF"

          AS_OF_EMAR=$(node -e "console.log(new Intl.DateTimeFormat('en-CA', { timeZone: 'Atlantic/Cape_Verde', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()))")
          echo "AS_OF_EMAR=$AS_OF_EMAR" >> "$GITHUB_ENV"
          echo "Validating EMAR/Kre+ opportunity currentness as of $AS_OF_EMAR (Atlantic/Cape_Verde, live)"

      - name: Validate canonical records
        run: node scripts/validate-things-to-do-events.mjs

      - name: Validate committed current surfaces
        run: |
          node scripts/validate-things-to-do-currentness.mjs --as-of="$AS_OF"
          node scripts/validate-things-to-do-surface-equivalence.mjs --as-of="$AS_OF"
          node scripts/validate-things-to-do-sitemap.mjs

      - name: Validate training opportunity currentness (EN + PT Home)
        run: node scripts/validate-training-opportunities-currentness.mjs --as-of="$AS_OF_EMAR" --home=index.html --home=pt/index.html

      - name: Validate card media
        shell: bash
        run: |
          set +e
          node scripts/validate-card-media.mjs
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            exit 1
          fi
          if [ "$code" -eq 2 ]; then
            echo "Media validator reported warnings/pending records; no hard errors."
          fi

      - name: Generate canonical surfaces for tracked currentness date
        run: node scripts/generate-things-to-do.mjs --as-of="$AS_OF" --write

      - name: Validate generated current surfaces
        run: |
          node scripts/validate-things-to-do-currentness.mjs --as-of="$AS_OF"
          node scripts/validate-things-to-do-surface-equivalence.mjs --as-of="$AS_OF"
          node scripts/validate-things-to-do-sitemap.mjs
          git diff --check

      - name: Verify generated diff scope
        shell: bash
        run: |
          unexpected=$(git diff --name-only | grep -Ev '^(index\.html|sitemap\.xml|things-to-do/[a-z0-9]+(-[a-z0-9]+)*/index\.html)$' || true)
          if [ -n "$unexpected" ]; then
            echo "Generator changed unexpected files:"
            echo "$unexpected"
            exit 1
          fi
          echo "Generated diff is limited to Home, sitemap, and canonical dated-event detail pages."

      - name: Save generated diff
        shell: bash
        run: |
          mkdir -p validation-artifacts
          git diff -- index.html sitemap.xml things-to-do/ > validation-artifacts/generated-surfaces.patch

      - name: Upload generated diff
        uses: actions/upload-artifact@v4
        with:
          name: things-to-do-generated-surfaces
          path: validation-artifacts/generated-surfaces.patch
          if-no-files-found: error

      - name: Verify committed surfaces match canonical generation
        run: git diff --exit-code -- index.html sitemap.xml things-to-do/

      - name: Verify currentness behavior is deterministic and idempotent across tracked dates
        shell: bash
        run: |
          set -e
          git reset --hard HEAD

          check_home_present() {
            if ! grep -q "<h3>$2</h3>" index.html; then
              echo "$1 incorrectly absent from Home as of $3."
              exit 1
            fi
          }
          check_home_absent() {
            if grep -q "<h3>$2</h3>" index.html; then
              echo "$1 incorrectly present on Home as of $3."
              exit 1
            fi
          }
          require_past_event() {
            if ! grep -q 'Past event' "things-to-do/$1/index.html"; then
              echo "$1 detail page is not marked Past event as of $2."
              exit 1
            fi
          }

          node scripts/generate-things-to-do.mjs --as-of=2026-08-24 --write
          node scripts/validate-things-to-do-currentness.mjs --as-of=2026-08-24
          node scripts/validate-things-to-do-surface-equivalence.mjs --as-of=2026-08-24
          check_home_absent part-ilhas "PART_ILHAS — ciclo de conversas com Nuno Miranda" 2026-08-24
          check_home_absent arquitectura "Arquitectura da Imperfeição" 2026-08-24
          check_home_present mon-pikenin "Mon Pikenin" 2026-08-24
          check_home_present sinergia "Sinergia da Matéria: Entre o Bruto e o Traço" 2026-08-24
          check_home_present eclipse "Exposição “Eclipse”" 2026-08-24
          check_home_present oficina "Exposição dos trabalhos finais do projeto Oficina Contemporânea Lata" 2026-08-24
          require_past_event part-ilhas-nuno-miranda 2026-08-24
          require_past_event arquitectura-da-imperfeicao 2026-08-24
          if grep -rq 'https://schema.org/EventCompleted' things-to-do/*/index.html; then
            echo 'A generated detail page emits invalid Schema.org EventCompleted status.'
            exit 1
          fi

          cp index.html /tmp/as-of-2026-08-24-index.html
          node scripts/generate-things-to-do.mjs --as-of=2026-08-24 --write
          if ! diff -q /tmp/as-of-2026-08-24-index.html index.html; then
            echo 'Repeated generation for the same --as-of is not byte-identical.'
            exit 1
          fi

          node scripts/generate-things-to-do.mjs --as-of=2026-08-30 --write
          node scripts/validate-things-to-do-currentness.mjs --as-of=2026-08-30
          node scripts/validate-things-to-do-surface-equivalence.mjs --as-of=2026-08-30
          check_home_absent part-ilhas "PART_ILHAS — ciclo de conversas com Nuno Miranda" 2026-08-30
          check_home_absent artemisa "PART_ILHAS — ciclo de conversas com Artemisa Ferreira" 2026-08-30
          check_home_absent arquitectura "Arquitectura da Imperfeição" 2026-08-30
          check_home_absent mon-pikenin "Mon Pikenin" 2026-08-30
          check_home_absent oficina "Exposição dos trabalhos finais do projeto Oficina Contemporânea Lata" 2026-08-30
          check_home_present sinergia "Sinergia da Matéria: Entre o Bruto e o Traço" 2026-08-30
          check_home_present eclipse "Exposição “Eclipse”" 2026-08-30
          require_past_event part-ilhas-artemisa-ferreira 2026-08-30
          if grep -rq 'https://schema.org/EventCompleted' things-to-do/*/index.html; then
            echo 'A generated detail page emits invalid Schema.org EventCompleted status.'
            exit 1
          fi

          node scripts/generate-things-to-do.mjs --as-of=2026-09-01 --write
          node scripts/validate-things-to-do-currentness.mjs --as-of=2026-09-01
          node scripts/validate-things-to-do-surface-equivalence.mjs --as-of=2026-09-01
          check_home_absent sinergia "Sinergia da Matéria: Entre o Bruto e o Traço" 2026-09-01
          check_home_present eclipse "Exposição “Eclipse”" 2026-09-01
          if grep -rq 'https://schema.org/EventCompleted' things-to-do/*/index.html; then
            echo 'A generated detail page emits invalid Schema.org EventCompleted status.'
            exit 1
          fi

          git reset --hard HEAD
